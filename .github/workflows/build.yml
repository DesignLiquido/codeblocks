name: Build

on:
  push:
    branches: [ principal, main, master ]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libwxgtk3.2-dev

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLINGUAGENS_DL_BUILD_SHARED=OFF

      - name: Build
        run: |
          cmake --build build --config Release -j2 2>&1 | tee build.log || true
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo '### Build Errors' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i 'error\|fatal' build.log | head -80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-wxwidgets3.2-msw

      - name: Configure
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLINGUAGENS_DL_BUILD_SHARED=OFF

      - name: Build
        shell: msys2 {0}
        run: |
          cmake --build build --config Release -j2 2>&1 | tee build.log || true
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo '### Build Errors' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -i 'error\|fatal' build.log | head -80 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
